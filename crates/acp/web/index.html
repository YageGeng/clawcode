<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; base-uri 'none'; object-src 'none'; img-src 'self' data: blob:; style-src 'self' https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' ws: wss:"
        />
        <title>Clawcode Web</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css"
            integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body>
        <div class="shell">
            <aside class="sidebar">
                <div class="brand">Clawcode</div>
                <div id="connectionStatus" class="status-pill">
                    Disconnected
                </div>
                <button
                    id="newSessionButton"
                    class="secondary-button"
                    type="button"
                >
                    New Session
                </button>
                <div class="sidebar-section">
                    <div class="section-title">History</div>
                    <div id="sessions" class="session-list"></div>
                    <button
                        id="loadMoreSessionsButton"
                        class="secondary-button hidden"
                        type="button"
                    >
                        Load More
                    </button>
                </div>
            </aside>

            <main class="chat-panel">
                <header class="topbar">
                    <div>
                        <div id="sessionLabel" class="session-label">
                            No session
                        </div>
                        <div id="runState" class="run-state">Idle</div>
                    </div>
                </header>

                <section
                    id="transcript"
                    class="transcript"
                    aria-live="polite"
                ></section>

                <form id="composer" class="composer">
                    <div class="composer-shell">
                        <textarea
                            id="promptInput"
                            rows="3"
                            placeholder="Message Clawcode"
                        ></textarea>
                        <div class="composer-toolbar">
                            <div class="composer-actions">
                                <div class="model-picker composer-model-picker">
                                    <span>Model</span>
                                    <select
                                        id="modelSelect"
                                        class="model-native-select"
                                        disabled
                                        tabindex="-1"
                                        aria-hidden="true"
                                    ></select>
                                    <button
                                        id="modelSelectButton"
                                        class="model-select-button"
                                        type="button"
                                        disabled
                                        aria-haspopup="listbox"
                                        aria-expanded="false"
                                    >
                                        <span id="modelSelectLabel">
                                            Model
                                        </span>
                                    </button>
                                    <div
                                        id="modelOptionsMenu"
                                        class="model-options-menu hidden"
                                        role="listbox"
                                    ></div>
                                </div>
                                <button
                                    id="sendCtxButton"
                                    class="send-ctx-button"
                                    type="button"
                                    aria-label="ctx: 0. tokens: -"
                                    title="ctx: 0&#10;tokens: -"
                                >
                                    <span
                                        id="ctxMeter"
                                        class="ctx-meter composer-ctx-meter"
                                        role="status"
                                        aria-label="ctx: 0. tokens: -"
                                    >
                                        <span class="ctx-ring">
                                            <span id="ctxMeterValue">0</span>
                                            <span class="ctx-meter-label">
                                                ctx
                                            </span>
                                        </span>
                                        <span
                                            id="ctxTooltip"
                                            class="usage-tooltip"
                                            role="tooltip"
                                        >
                                            <span class="usage-tooltip-title">
                                                Context Usage
                                            </span>
                                            <span id="ctxTooltipContext">
                                                ctx: 0
                                            </span>
                                            <span id="ctxTooltipTokens">
                                                tokens: -
                                            </span>
                                        </span>
                                    </span>
                                </button>
                                <button
                                    id="cancelButton"
                                    class="secondary-button hidden"
                                    type="button"
                                >
                                    Cancel
                                </button>
                                <button
                                    id="sendButton"
                                    class="send-button"
                                    type="submit"
                                    aria-label="Send message"
                                    title="Send message"
                                >
                                    <span
                                        class="send-button-arrow"
                                        aria-hidden="true"
                                    >
                                        &uarr;
                                    </span>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </main>
        </div>

        <div
            id="permissionModal"
            class="modal hidden"
            role="dialog"
            aria-modal="true"
        >
            <div class="modal-card">
                <div class="section-title">Permission Request</div>
                <h2 id="permissionTitle"></h2>
                <pre id="permissionBody"></pre>
                <div id="permissionOptions" class="permission-actions"></div>
            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
            integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        <script
            data-library="DOMPurify"
            src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"
            integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"
            integrity="sha384-wQX/HE4cHEfyVNknht8z4V6Sv7BRsHKI3XXO26tXc0424Y+zxIOWqRxKjHAKRUdr"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        <script src="/app.js"></script>
    </body>
</html>
