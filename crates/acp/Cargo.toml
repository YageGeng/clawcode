[package]
name = "acp"
edition.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
# workspace crates
kernel = { workspace = true }
protocol = { workspace = true }

# error
thiserror = { workspace = true }

# tracing & log
tracing = { workspace = true }

# async
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "net", "sync", "time"] }
tokio-util = { workspace = true }

# http
agent-client-protocol-http = { workspace = true, features = ["server"] }
axum = { workspace = true }

# serde
jsonschema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# builder
typed-builder = { workspace = true }

# protocol
agent-client-protocol = { workspace = true, features = ["stdio", "unstable_end_turn_token_usage", "unstable_protocol_v2"] }

# misc
base64 = { workspace = true }

[dev-dependencies]
# workspace crates
extension = { workspace = true }
mcp = { workspace = true }
prompt = { workspace = true }
skill = { workspace = true }
store = { workspace = true }
tools = { workspace = true }

# async
tokio = { workspace = true, features = ["test-util", "time"] }
tokio-util = { workspace = true }

# tracing & log
tracing-subscriber = { workspace = true }

# fs
tempfile = { workspace = true }
