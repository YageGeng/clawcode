[workspace]
members = [
  "crates/acp",
  "crates/app",
  "crates/config",
  "crates/extension",
  "crates/kernel",
  "crates/mcp",
  "crates/prompt",
  "crates/protocol",
  "crates/provider",
  "crates/skill",
  "crates/store",
  "crates/tools",
  "extensions",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_import_braces = "deny"
elided_lifetimes_in_paths = "deny"

[workspace.lints.clippy]
# Panic prevention
string_slice = "warn"
indexing_slicing = "warn"

unwrap_used = "warn"
panic = "warn"
get_unwrap = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

# Silent failure prevention
let_underscore_future = "warn"
let_underscore_must_use = "allow"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Async/concurrency safety
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"

# Numeric safety
float_cmp = "warn"
float_cmp_const = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"

# Unsafe code safety
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
mem_forget = "warn"

[workspace.dependencies]
# workspace crates
acp = { path = "crates/acp" }
config = { path = "crates/config" }
extension = { path = "crates/extension" }
extensions = { path = "extensions" }
kernel = { path = "crates/kernel" }
mcp = { path = "crates/mcp" }
prompt = { path = "crates/prompt" }
protocol = { path = "crates/protocol" }
provider = { path = "crates/provider" }
skill = { path = "crates/skill" }
store = { path = "crates/store" }
tools = { path = "crates/tools" }

# error
anyhow = "1"
thiserror = "2"

# tracing & log
tracing = "0.1"
tracing-futures = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["chrono", "env-filter"] }

# async
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
tokio-test = "0.4"
tokio-util = "0.7"
pin-project-lite = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Match Axum's WebSocket stack to avoid compiling two Tungstenite versions.
tokio-tungstenite = { version = "0.30", default-features = false }

# http
bytes = "1"
http = "1"
httpdate = "=1.0.3"
axum = "0.8"
url = "2.5"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs"] }
eventsource-stream = "0.2"
reqwest = { version = "0.13", default-features = false }
reqwest-middleware = { version = "0.5", default-features = false }

# serde
figment = { version = "0.10", features = ["toml", "env"] }
jsonschema = { version = "=0.51", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"

# builder
typed-builder = "0.23"

# wasm
wasm-bindgen-futures = "0.4"

# fs
ignore = "0.4"
mime = "0.3.17"
mime_guess = "2.0.5"
tempfile = "3"
# Match Figment's TOML major version to avoid compiling parallel parser stacks.
toml = "=0.8"

# acp
agent-client-protocol = "2"
agent-client-protocol-http = { version = "2", default-features = false }

# cli
clap = { version = "4", features = ["derive"] }

# pty
nix = { version = "0.31", features = ["signal", "process"] }

# misc
arc-swap = "1.9"
dirs = "6"
base64 = "0.23"
fastrand = "2"
futures-timer = "3"
getrandom = "0.4"
nanoid = "0.5"
rmcp = { version = "3", default-features = false }
shlex = "2"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
similar = "3"
unicode-normalization = "0.1"
