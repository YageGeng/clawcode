[workspace]
members = [
  "crates/acp",
  "crates/app",
  "crates/config",
  "crates/extension",
  "crates/kernel",
  "crates/mcp",
  "crates/protocol",
  "crates/provider",
  "crates/skill",
  "crates/store",
  "crates/tools",
  "extensions",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_import_braces = "deny"
elided_lifetimes_in_paths = "deny"

[workspace.lints.clippy]
# Panic prevention
string_slice = "warn"
indexing_slicing = "warn"

unwrap_used = "warn"
panic = "warn"
get_unwrap = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

# Silent failure prevention
let_underscore_future = "warn"
let_underscore_must_use = "allow"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Async/concurrency safety
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"

# Numeric safety
float_cmp = "warn"
float_cmp_const = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"

# Unsafe code safety
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
mem_forget = "warn"

[workspace.dependencies]
# workspace crates
acp = { path = "crates/acp" }
config = { path = "crates/config" }
extension = { path = "crates/extension" }
extensions = { path = "extensions" }
kernel = { path = "crates/kernel" }
mcp = { path = "crates/mcp" }
protocol = { path = "crates/protocol" }
provider = { path = "crates/provider" }
skill = { path = "crates/skill" }
store = { path = "crates/store" }
tools = { path = "crates/tools" }

# error
anyhow = "1"
thiserror = "2"

# tracing & log
tracing = "0.1"
tracing-futures = "0.2.5"
serenity = "0.12"
opentelemetry = "0.32"
opentelemetry-otlp = "0.32"
opentelemetry_sdk = "0.32"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"

# async
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
tokio-stream = "0.1"
tokio-test = "0.4"
tokio-util = "0.7"
pin-project-lite = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false }

# multi thread
rayon = "1"

# http
bytes = "1"
http = "1"
httpdate = "=1.0.3"
axum = "0.8"
url = "2.5"
hyper-util = "0.1"
agent-client-protocol-http = { version = "2", default-features = false }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs"] }
reqwest-retry = "0.9"
eventsource-stream = "0.2"
reqwest = { version = "0.13", default-features = false }
reqwest-middleware = { version = "0.5", default-features = false }

# serde
serde_json = "1"
serde = { version = "1", features = ["derive"] }
schemars = "1"
quick-xml = "0.41"
serde_path_to_error = "0.1"
figment = { version = "0.10", features = ["toml", "env"] }

# builder
typed-builder = "0.23"

# wasm
wasm-bindgen-futures = "0.4"

# date & time
chrono = { version = "0.4", default-features = false }

# fs
toml = "1"
mime = "0.3.17"
mime_guess = "2.0.5"
assert_fs = "1"
tempfile = "3"

# protocol
agent-client-protocol = "2"

# cli
clap = { version = "4", features = ["derive"] }

# tui
crossterm = "0.29"
ratatui = "0.30"
unicode-width = "0.2"

# pty
portable-pty = "0.9"
nix = { version = "0.31", features = ["signal", "process"] }

# misc
arc-swap = "1.9"
wiremock = "0.6"
dirs = "6"
base64 = "0.23"
rand = "0.10"
fastrand = "2"
futures-timer = "3"
getrandom = "0.4"
nanoid = "0.5"
ordered-float = "5.3"
rmcp = { version = "3", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
shlex = "2"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
similar = "3"
unicode-normalization = "0.1"
