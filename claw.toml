active_model = "deepseek/deepseek-flash"

[app.recovery]
# Caps source Session updates consumed into one outbound ACP frame.
max_batch_size = 512

[kernel]
max_turns = { type = "unlimited" }
# max_turns = { type = "limited", turns = 64 }

[subagent]
# Children of one main agent allowed to run at the same time.
max_agents = 100

[logging]
filter = "info"
color = true

[extensions]
enabled = ["command-guard"]

[prompt]
load_project_instructions = true
load_templates = true
template_paths = []

# Approval strategy to use.
approval = "yolo"

[retry]
enabled = true
max_retries = 3
base_delay_ms = 2000

[retry.provider]
timeout_ms = 120000
max_retries = 2
max_retry_delay_ms = 60000

[compaction]
enabled = true
reserve_tokens = 65536
keep_recent_tokens = 20000

[[providers]]
id = "deepseek"
display_name = "DeepSeek"
provider_type = "openai-completions"
base_url = "https://api.deepseek.com"

[providers.api_key]
env = "DEEPSEEK_API_KEY"

[[providers.models]]
id = "deepseek-flash"
display_name = "DeepSeek V4 Flash"
context_tokens = 1000000
max_output_tokens = 384000

[[providers]]
id = "chatgpt"
display_name = "ChatGPT"
auth = { type = "chatgpt", auth_dir = "~/.clawcode/chatgpt" }
prompt_cache = "long"

# Limits and input mirror the rig 0.46 chatgpt catalog. context_tokens is the per-request
# input cap (922k of the 1.05M window); the catalog's PDF input is not supported here.
# gpt-5.5 and older answer model_not_found for ChatGPT accounts, so they are omitted.
[[providers.models]]
id = "gpt-6.1-sol"
display_name = "GPT-6.1 Sol"
context_tokens = 922000
max_output_tokens = 128000
input = ["text", "image"]

