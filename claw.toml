active_model = "chatgpt/gpt-6-astra"

[app.recovery]
# Caps source Session updates consumed into one outbound ACP frame.
max_batch_size = 512

[kernel]
max_turns = { type = "unlimited" }
# max_turns = { type = "limited", turns = 64 }

[subagent]
# How a background subagent's reply joins a busy main agent: "follow_up" or "steer".
reply_as = "steer"

[logging]
filter = "info,acp::trace=debug"
color = true

[extensions]
enabled = ["command-guard"]

[prompt]
load_project_instructions = true
load_templates = true
template_paths = []

# Approval strategy to use.
approval = "yolo"

[retry]
enabled = true
max_retries = 3
base_delay_ms = 2000

[retry.provider]
timeout_ms = 120000
max_retries = 2
max_retry_delay_ms = 60000

[compaction]
enabled = true
reserve_tokens = 65536
keep_recent_tokens = 20000

[[providers]]
id = "deepseek"
display_name = "DeepSeek"
provider_type = "openai-completions"
base_url = "https://api.deepseek.com"

[providers.api_key]
env = "DEEPSEEK_API_KEY"

[[providers.models]]
id = "deepseek-flash"
display_name = "DeepSeek V4 Flash"
context_tokens = 1000000
max_output_tokens = 384000

[[providers]]
id = "chatgpt"
display_name = "ChatGPT"
auth = { type = "chatgpt", auth_dir = "~/.clawcode/chatgpt" }
prompt_cache = "long"

[[providers.models]]
id = "gpt-6-astra"
