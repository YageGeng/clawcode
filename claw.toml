active_model = "deepseek/deepseek-v4-flash"

[logging]
filter = "info,acp::trace=debug"
color = true

[extensions]
enabled = ["command-guard"]

[prompt]
load_project_instructions = true
load_templates = true
template_paths = []

# Approval strategy to use.
approval = "yolo"

[retry]
enabled = true
max_retries = 3
base_delay_ms = 2000

[retry.provider]
timeout_ms = 120000
max_retries = 2
max_retry_delay_ms = 60000

[compaction]
enabled = true
reserve_tokens = 16384
keep_recent_tokens = 20000

[[providers]]
id = "deepseek"
display_name = "DeepSeek"
provider_type = "openai-completions"
base_url = "https://api.deepseek.com"

[providers.api_key]
env = "DEEPSEEK_API_KEY"

[[providers.models]]
id = "deepseek-v4-flash"
display_name = "DeepSeek V4 Flash"
context_tokens = 1000000
max_output_tokens = 384000

[providers.models.extra_param]
thinking = { type = "enabled" }
reasoning_effort = "high"

[[providers.models]]
id = "deepseek-v4-pro"
display_name = "DeepSeek V4 Pro"
context_tokens = 1000000
max_output_tokens = 384000

[providers.models.extra_param]
thinking = { type = "enabled" }
reasoning_effort = "high"

[[mcp_servers]]
enabled = true
name = "legacy-reference"
protocol = "2025-11-25"
command = "cargo"
args = ["run", "--quiet", "-p", "mcp", "--example", "legacy_stdio"]
startup_timeout_sec = 30
request_timeout_sec = 120
mrtr_max_rounds = 8
mrtr_total_timeout_sec = 300

[[mcp_servers]]
enabled = true
name = "modern-reference"
protocol = "2026-07-28"
url = "http://127.0.0.1:39128/mcp"
startup_timeout_sec = 30
request_timeout_sec = 120
mrtr_max_rounds = 8
mrtr_total_timeout_sec = 300
